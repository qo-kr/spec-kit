schema_version: "1.0"

extension:
  id: oq
  name: "OQ Workflow Pack"
  version: "1.0.0"
  description: "OQ team's extended Speckit workflows for preparation, collaborative review, document review, and full-auto execution."
  author: qo-kr
  repository: https://github.com/qo-kr/spec-kit
  license: MIT

requires:
  speckit_version: ">=0.8.0"
  tools:
    - name: git
      required: false
    - name: gh
      required: false
    - name: codex
      required: false
  commands:
    - speckit.specify
    - speckit.clarify
    - speckit.plan
    - speckit.tasks
    - speckit.analyze
    - speckit.implement
    - speckit.checklist

provides:
  commands:
    - name: speckit.oq.prepare
      file: commands/speckit.oq.prepare.md
      description: "Run OQ's batched speckit preparation flow from specify through analyze."
      aliases: ["speckit.prepare"]
    - name: speckit.oq.collab-review
      file: commands/speckit.oq.collab-review.md
      description: "Run the collaborative Claude plus Codex review loop with the user as relay."
      aliases: ["speckit.collab-review"]
    - name: speckit.oq.auto-review
      file: commands/speckit.oq.auto-review.md
      description: "Run OQ's fully automated Codex-backed review loop."
      aliases: ["speckit.auto-review"]
    - name: speckit.oq.auto-review-strict
      file: commands/speckit.oq.auto-review-strict.md
      description: "Run OQ's strict automated review loop including LOW severity findings."
      aliases: ["speckit.auto-review-strict"]
    - name: speckit.oq.doc-review
      file: commands/speckit.oq.doc-review.md
      description: "Run OQ's multi-round Markdown and spec document review workflow."
      aliases: ["speckit.doc-review"]
    - name: speckit.oq.full-auto
      file: commands/speckit.oq.full-auto.md
      description: "Run OQ's end-to-end spec-to-merge pipeline."
      aliases: ["speckit.full-auto"]

tags:
  - oq
  - workflow
  - review
  - automation
